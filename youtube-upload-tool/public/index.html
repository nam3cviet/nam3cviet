<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Upload Tool</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <h1>YouTube Upload Tool</h1>

    <section id="signed-out" hidden>
      <p>Sign in with a Google account that has a YouTube channel to upload videos.</p>
      <a class="btn" href="/auth/google">Sign in with Google</a>
      <p class="error" id="auth-error" hidden></p>
    </section>

    <section id="signed-in" hidden>
      <div class="topbar">
        <span>Signed in</span>
        <form action="/auth/logout" method="post"><button class="link-btn" type="submit">Sign out</button></form>
      </div>

      <form id="upload-form">
        <label>
          Video file
          <input type="file" name="video" id="video" accept="video/*" required />
        </label>

        <label>
          Title
          <input type="text" name="title" id="title" maxlength="100" required />
        </label>

        <label>
          Description
          <textarea name="description" id="description" rows="4" maxlength="5000"></textarea>
        </label>

        <label>
          Tags <span class="hint">(comma separated)</span>
          <input type="text" name="tags" id="tags" placeholder="tag1, tag2, tag3" />
        </label>

        <label>
          Privacy
          <select name="privacyStatus" id="privacyStatus">
            <option value="private">Private</option>
            <option value="unlisted">Unlisted</option>
            <option value="public">Public</option>
          </select>
        </label>

        <label>
          Thumbnail <span class="hint">(optional)</span>
          <input type="file" name="thumbnail" id="thumbnail" accept="image/*" />
        </label>

        <button class="btn" type="submit" id="submit-btn">Upload</button>
      </form>

      <div id="progress-area" hidden>
        <div class="progress-row">
          <span>Uploading to server</span>
          <progress id="upload-progress" value="0" max="100"></progress>
          <span id="upload-progress-label">0%</span>
        </div>
        <div class="progress-row">
          <span>Publishing to YouTube</span>
          <progress id="youtube-progress" value="0" max="100"></progress>
          <span id="youtube-progress-label">0%</span>
        </div>
        <p id="status-message"></p>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
