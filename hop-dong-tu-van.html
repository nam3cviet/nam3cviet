<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TVV | Quản lý Hợp đồng Tư vấn</title>
<style>
:root {
  --navy: #0f1729;
  --navy-2: #1c2537;
  --primary: #4f46e5;
  --primary-dark: #4338ca;
  --primary-soft: #eef2ff;
  --bg: #f3f4f9;
  --surface: #ffffff;
  --border: #e5e7f0;
  --text: #1e2333;
  --text-muted: #667085;
  --green: #16a34a;
  --amber: #d97706;
  --red: #dc2626;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
  --shadow-md: 0 4px 14px rgba(16, 24, 40, 0.08);
  --shadow-lg: 0 16px 36px rgba(16, 24, 40, 0.14);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14.5px;
}

button, input, select, textarea {
  transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
}

.form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus,
.toolbar input:focus, .toolbar select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}

.app {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 240px;
  flex-shrink: 0;
  background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 16px;
}

.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: -0.02em;
  flex-shrink: 0;
  box-shadow: 0 4px 10px rgba(79, 70, 229, 0.4);
}

.brand-title { font-weight: 700; font-size: 14px; color: #fff; }
.brand-sub { font-size: 11.5px; color: #94a3b8; }

.nav { display: flex; flex-direction: column; gap: 3px; flex: 1; }

.nav-item {
  display: block;
  text-align: left;
  background: transparent;
  border: none;
  color: #cbd5e1;
  padding: 14px 16px;
  border-radius: 10px;
  font-size: 15.5px;
  font-weight: 600;
  cursor: pointer;
}

.nav-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
.nav-item.active { background: var(--primary); color: #fff; box-shadow: var(--shadow-md); }

.sidebar-footer {
  font-size: 11px;
  color: #64748b;
  padding: 10px 8px 0;
  border-top: 1px solid rgba(255,255,255,0.08);
}

/* Content */
.content {
  flex: 1;
  padding: 28px 32px;
  overflow-y: auto;
  max-width: 100%;
}

.view { display: none; }
.view.active { display: block; }

.page-header { margin-bottom: 22px; }
.page-header h2 { margin: 0 0 4px; font-size: 23px; font-weight: 800; letter-spacing: -0.01em; }
.page-header.row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.muted { color: var(--text-muted); }
.small { font-size: 12px; }
.hint { color: var(--amber); font-size: 12.5px; margin-top: 8px; }

.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }

/* Buttons */
.btn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  padding: 11px 20px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}
.btn:hover { background: #f8fafc; border-color: #cbd5e1; }
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 6px 16px rgba(79, 70, 229, 0.32);
}
.btn-primary:hover { filter: brightness(1.06); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4); }
.btn-sm { padding: 8px 14px; font-size: 13px; }
.btn.danger { color: var(--red); border-color: #fecaca; }
.btn.danger:hover { background: #fef2f2; }

.icon-btn {
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 9px 11px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
}
.icon-btn:hover { background: var(--primary-soft); color: var(--primary-dark); }
.icon-btn.danger:hover { background: #fef2f2; color: var(--red); }
.icon-btn:active { transform: scale(0.94); }

/* Stat cards */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}

.stat-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  border-left: 4px solid var(--primary);
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}
.stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.stat-card.tone-blue { border-left-color: #4f46e5; }
.stat-card.tone-indigo { border-left-color: #6366f1; }
.stat-card.tone-green { border-left-color: #16a34a; }
.stat-card.tone-teal { border-left-color: #0d9488; }
.stat-card.tone-amber { border-left-color: #d97706; }
.stat-card.tone-red { border-left-color: #dc2626; }

.stat-icon { position: absolute; top: 16px; right: 16px; font-size: 20px; opacity: 0.5; }
.stat-label { font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
.stat-value { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }

/* Cards & grid layout */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}
.card h3 { margin: 0 0 14px; font-size: 15px; font-weight: 700; }

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
@media (max-width: 900px) {
  .grid-2 { grid-template-columns: 1fr; }
  .sidebar { width: 76px; }
  .brand-title, .brand-sub, .sidebar-footer, .nav-item { display: none; }
  .brand { justify-content: center; }
}

/* Alerts */
.alert-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
.alert-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: #f8fafc;
  border-left: 3px solid var(--amber);
  font-size: 13px;
}
.alert-item.danger { border-left-color: var(--red); background: #fef2f2; }
.alert-item.warning { border-left-color: var(--amber); background: #fffbeb; }
.empty { color: var(--text-muted); text-align: center; padding: 18px 0; font-size: 13px; }

/* Toolbar & tables */
.toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar input, .toolbar select { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13.5px; background: var(--surface); }
.toolbar input { flex: 1; min-width: 220px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th, .data-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table th { background: #f8fafc; color: var(--text-muted); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover { background: var(--primary-soft); }
.actions { display: flex; gap: 4px; white-space: nowrap; }

/* Badges */
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
}
.badge-red { background: #fee2e2; color: #dc2626; }
.badge-amber { background: #fef3c7; color: #d97706; }
.badge-green { background: #dcfce7; color: #16a34a; }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal-dialog {
  background: var(--surface);
  border-radius: 18px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
}
.modal-dialog.wide { max-width: 760px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); }
.modal-header h3 { margin: 0; font-size: 17px; font-weight: 700; }
.modal-body { padding: 22px; overflow-y: auto; }
.modal-footer { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

/* Forms */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid label { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
.form-grid .col-span-2 { grid-column: span 2; }
.form-grid input, .form-grid select, .form-grid textarea {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: var(--text);
  font-family: inherit;
  background: var(--surface);
}
.form-grid textarea { resize: vertical; }

.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.detail-grid .muted { font-size: 11.5px; display: block; margin-bottom: 2px; }

.totals-box { max-width: 300px; margin-left: auto; font-size: 13px; }
.totals-box div { display: flex; justify-content: space-between; padding: 4px 0; }
.totals-box .grand { font-weight: 700; border-top: 1px solid var(--border); margin-top: 4px; padding-top: 8px; font-size: 14.5px; }

canvas { width: 100%; display: block; }

.lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lang-btn { padding: 16px; font-size: 14.5px; font-weight: 700; border-radius: var(--radius-sm); }
.lang-btn:hover { border-color: var(--primary); color: var(--primary-dark); background: var(--primary-soft); }

/* Phone layout: bottom tab bar instead of side rail, single-column forms.
   Placed last so it wins the cascade over same-specificity rules above. */
@media (max-width: 640px) {
  html, body { font-size: 15px; }

  .app { flex-direction: column; }

  .sidebar {
    width: 100%;
    height: auto;
    flex-direction: row;
    align-items: stretch;
    padding: 0;
    position: fixed;
    left: 0; right: 0; bottom: 0; top: auto;
    z-index: 60;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .brand, .sidebar-footer { display: none; }
  .nav {
    flex: 1;
    flex-direction: row;
    gap: 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .nav-item {
    display: flex;
    flex: 0 0 auto;
    white-space: nowrap;
    border-radius: 0;
    padding: 12px 16px;
    font-size: 13px;
  }

  .content { padding: 16px 14px 84px; }

  .page-header.row { flex-direction: column; align-items: stretch; }
  .page-header.row .btn { width: 100%; }

  .toolbar { flex-direction: column; }
  .toolbar input, .toolbar select { width: 100%; min-width: 0; }

  .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat-card { padding: 12px 14px; }
  .stat-value { font-size: 17px; }

  .form-grid { grid-template-columns: 1fr; }
  .form-grid .col-span-2 { grid-column: span 1; }
  .detail-grid { grid-template-columns: 1fr; }

  .modal-overlay { padding: 0; align-items: flex-end; }
  .modal-dialog, .modal-dialog.wide { max-width: 100%; max-height: 92vh; border-radius: 14px 14px 0 0; }

  .lang-grid { grid-template-columns: 1fr; }
}

</style>

/* ===== utils.js ===== */
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function formatCurrency(n) {
  const num = Number(n) || 0;
  return num.toLocaleString("vi-VN") + " đ";
}

function formatDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  return d.toLocaleDateString("vi-VN");
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(dateStr);
  if (isNaN(target)) return null;
  target.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}

function escapeHtml(str = "") {
  return String(str).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[c]));
}

const VI_DIGITS = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];
const VI_UNITS = ["", "nghìn", "triệu", "tỷ"];

function viThreeDigits(n, fullZero) {
  const h = Math.floor(n / 100);
  const t = Math.floor((n % 100) / 10);
  const u = n % 10;
  let out = "";
  if (h > 0 || fullZero) out += `${VI_DIGITS[h]} trăm `;
  if (t > 1) {
    out += `${VI_DIGITS[t]} mươi `;
    if (u === 1) out += "mốt ";
    else if (u === 5) out += "lăm ";
    else if (u > 0) out += `${VI_DIGITS[u]} `;
  } else if (t === 1) {
    out += "mười ";
    if (u === 5) out += "lăm ";
    else if (u > 0) out += `${VI_DIGITS[u]} `;
  } else if (t === 0 && u > 0) {
    if (h > 0 || fullZero) out += "lẻ ";
    out += `${VI_DIGITS[u]} `;
  }
  return out.trim();
}

// Vietnamese amount-in-words, as required on official contracts/quotes.
function numberToWordsVi(amount) {
  const n = Math.round(Math.abs(Number(amount) || 0));
  if (n === 0) return "Không đồng";
  const groups = [];
  let rest = n;
  while (rest > 0) {
    groups.unshift(rest % 1000);
    rest = Math.floor(rest / 1000);
  }
  const parts = [];
  groups.forEach((g, idx) => {
    if (g === 0) return;
    const unitIdx = groups.length - 1 - idx;
    const fullZero = idx > 0;
    parts.push(`${viThreeDigits(g, fullZero)} ${VI_UNITS[unitIdx] || ""}`.trim());
  });
  const words = parts.join(" ").replace(/\s+/g, " ").trim();
  const capitalized = words.charAt(0).toUpperCase() + words.slice(1);
  return `${capitalized} đồng`;
}

const EN_ONES = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten",
  "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
const EN_TENS = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
const EN_UNITS = ["", "Thousand", "Million", "Billion"];

function enThreeDigits(n) {
  const h = Math.floor(n / 100);
  const rest = n % 100;
  let out = "";
  if (h > 0) out += `${EN_ONES[h]} Hundred `;
  if (rest >= 20) {
    out += EN_TENS[Math.floor(rest / 10)];
    if (rest % 10 > 0) out += `-${EN_ONES[rest % 10]}`;
    out += " ";
  } else if (rest > 0) {
    out += `${EN_ONES[rest]} `;
  }
  return out.trim();
}

// English amount-in-words, used for the EN print template.
function numberToWordsEn(amount) {
  const n = Math.round(Math.abs(Number(amount) || 0));
  if (n === 0) return "Zero dong";
  const groups = [];
  let rest = n;
  while (rest > 0) {
    groups.unshift(rest % 1000);
    rest = Math.floor(rest / 1000);
  }
  const parts = [];
  groups.forEach((g, idx) => {
    if (g === 0) return;
    const unitIdx = groups.length - 1 - idx;
    parts.push(`${enThreeDigits(g)} ${EN_UNITS[unitIdx] || ""}`.trim());
  });
  return `${parts.join(" ").replace(/\s+/g, " ").trim()} dong`;
}

/* ===== charts.js ===== */
function setupCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const height = rect.height || Number(canvas.getAttribute("height")) || 220;
  canvas.style.height = height + "px";
  canvas.width = rect.width * dpr;
  canvas.height = height * dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, width: rect.width, height };
}

function roundRectTop(ctx, x, y, w, h, r) {
  if (h <= 0.5) return;
  const rr = Math.min(r, w / 2, h);
  ctx.beginPath();
  ctx.moveTo(x, y + h);
  ctx.lineTo(x, y + rr);
  ctx.arcTo(x, y, x + rr, y, rr);
  ctx.lineTo(x + w - rr, y);
  ctx.arcTo(x + w, y, x + w, y + rr, rr);
  ctx.lineTo(x + w, y + h);
  ctx.closePath();
}

function drawBarChart(canvas, labels, values, { color = "#2563eb", formatValue } = {}) {
  const { ctx, width, height } = setupCanvas(canvas);
  const padding = { top: 16, right: 12, bottom: 26, left: 54 };
  const chartW = width - padding.left - padding.right;
  const chartH = height - padding.top - padding.bottom;
  const max = Math.max(1, ...values);

  ctx.clearRect(0, 0, width, height);
  ctx.font = "11px system-ui, sans-serif";
  ctx.fillStyle = "#94a3b8";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";

  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const y = padding.top + chartH - (chartH / steps) * i;
    const val = (max / steps) * i;
    ctx.strokeStyle = "#eef2f7";
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(width - padding.right, y);
    ctx.stroke();
    ctx.fillStyle = "#94a3b8";
    ctx.fillText(formatValue ? formatValue(val) : String(Math.round(val)), padding.left - 8, y);
  }

  const gap = chartW / values.length;
  const barW = Math.min(36, gap * 0.55);
  ctx.textAlign = "center";
  values.forEach((v, i) => {
    const x = padding.left + gap * i + (gap - barW) / 2;
    const h = max === 0 ? 0 : (v / max) * chartH;
    const y = padding.top + chartH - h;
    ctx.fillStyle = color;
    roundRectTop(ctx, x, y, barW, h, 4);
    ctx.fill();
    ctx.fillStyle = "#64748b";
    ctx.font = "11px system-ui, sans-serif";
    ctx.fillText(labels[i], x + barW / 2, padding.top + chartH + 16);
  });
}

function drawDonutChart(canvas, segments) {
  const { ctx, width, height } = setupCanvas(canvas);
  ctx.clearRect(0, 0, width, height);
  const total = segments.reduce((s, seg) => s + seg.value, 0);
  const legendW = 150;
  const cx = Math.min((width - legendW) / 2, height / 2);
  const cy = height / 2;
  const radius = Math.max(30, Math.min(cx, cy) - 8);
  const inner = radius * 0.62;

  if (total === 0) {
    ctx.strokeStyle = "#e2e8f0";
    ctx.lineWidth = radius - inner;
    ctx.beginPath();
    ctx.arc(cx, cy, (radius + inner) / 2, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    let start = -Math.PI / 2;
    segments.forEach((seg) => {
      if (seg.value <= 0) return;
      const angle = (seg.value / total) * Math.PI * 2;
      ctx.fillStyle = seg.color;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, start, start + angle);
      ctx.closePath();
      ctx.fill();
      start += angle;
    });
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(cx, cy, inner, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.font = "12px system-ui, sans-serif";
  let ly = cy - (segments.length * 20) / 2 + 10;
  segments.forEach((seg) => {
    ctx.fillStyle = seg.color;
    ctx.fillRect(cx + radius + 16, ly - 5, 10, 10);
    ctx.fillStyle = "#334155";
    ctx.fillText(`${seg.label} (${seg.value})`, cx + radius + 32, ly);
    ly += 20;
  });
}

/* ===== ocr.js ===== */
function isPdfFile(file) {
  return file.type === "application/pdf" || /\.pdf$/i.test(file.name);
}

function ocrLibsAvailable() {
  return typeof Tesseract !== "undefined";
}

async function renderPdfFirstPageToCanvas(file) {
  if (typeof pdfjsLib === "undefined") {
    throw new Error("Không tải được thư viện đọc PDF (pdf.js). Vui lòng kiểm tra kết nối Internet.");
  }
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 3 });
  const canvas = document.createElement("canvas");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext("2d");
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas;
}

async function loadImageFile(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
      img.src = url;
    });
    return img;
  } finally {
    URL.revokeObjectURL(url);
  }
}

// Otsu's method: picks the grey-level threshold that best separates text from
// background, so it adapts to each document instead of using one fixed cutoff.
function otsuThreshold(histogram, totalPixels) {
  let sumAll = 0;
  for (let i = 0; i < 256; i++) sumAll += i * histogram[i];

  let sumBackground = 0;
  let weightBackground = 0;
  let maxVariance = 0;
  let threshold = 127;

  for (let t = 0; t < 256; t++) {
    weightBackground += histogram[t];
    if (weightBackground === 0) continue;
    const weightForeground = totalPixels - weightBackground;
    if (weightForeground === 0) break;

    sumBackground += t * histogram[t];
    const meanBackground = sumBackground / weightBackground;
    const meanForeground = (sumAll - sumBackground) / weightForeground;
    const variance = weightBackground * weightForeground * (meanBackground - meanForeground) ** 2;
    if (variance > maxVariance) {
      maxVariance = variance;
      threshold = t;
    }
  }
  return threshold;
}

// Upscales small scans, converts to greyscale, then binarizes with Otsu's method.
// Flat, high-contrast black-on-white text is what OCR engines read most reliably —
// this compensates for dim photos, uneven lighting and low-resolution scans.
function preprocessForOcr(source) {
  const srcW = source.naturalWidth || source.width;
  const srcH = source.naturalHeight || source.height;
  const minWidth = 1800;
  const maxWidth = 2600;
  let scale = srcW < minWidth ? minWidth / srcW : 1;
  if (srcW * scale > maxWidth) scale = maxWidth / srcW;

  const canvas = document.createElement("canvas");
  canvas.width = Math.round(srcW * scale);
  canvas.height = Math.round(srcH * scale);
  const ctx = canvas.getContext("2d");
  ctx.drawImage(source, 0, 0, canvas.width, canvas.height);

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const { data } = imageData;
  const grey = new Uint8ClampedArray(canvas.width * canvas.height);
  const histogram = new Array(256).fill(0);

  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    const g = Math.round(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
    grey[p] = g;
    histogram[g]++;
  }

  const threshold = otsuThreshold(histogram, grey.length);
  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    const v = grey[p] < threshold ? 0 : 255;
    data[i] = v;
    data[i + 1] = v;
    data[i + 2] = v;
  }
  ctx.putImageData(imageData, 0, 0);
  return canvas;
}

let ocrWorkerPromise = null;
function getOcrWorker() {
  if (!ocrWorkerPromise) {
    ocrWorkerPromise = Tesseract.createWorker("vie+eng");
  }
  return ocrWorkerPromise;
}

async function ocrFile(file) {
  if (!ocrLibsAvailable()) {
    throw new Error("Không tải được thư viện nhận diện văn bản (Tesseract). Vui lòng kiểm tra kết nối Internet rồi thử lại.");
  }
  const rawSource = isPdfFile(file) ? await renderPdfFirstPageToCanvas(file) : await loadImageFile(file);
  const processed = preprocessForOcr(rawSource);
  const worker = await getOcrWorker();
  const { data } = await worker.recognize(processed);
  return data.text || "";
}

/* ---------------- Parsing ---------------- */

// Strips Vietnamese diacritics (and folds đ/Đ -> d/D) so label matching survives
// OCR mistakes on accent marks — the most common source of misreads.
function stripDiacritics(str) {
  return str
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .replace(/đ/g, "d")
    .replace(/Đ/g, "D");
}

function cleanValue(str) {
  return (str || "").trim().replace(/^[\s:.\-–]+/, "").replace(/[\s.,;:\-–]+$/, "").replace(/\s+/g, " ");
}

// Cuts a captured value off before a trailing label OCR ran onto the same line
// (e.g. "NGUYỄN VĂN A Giới tính: Nam" -> "NGUYỄN VĂN A").
function trimTrailingLabels(value, labelsNorm) {
  if (!value) return value;
  const norm = stripDiacritics(value.toLowerCase());
  let cut = value.length;
  for (const label of labelsNorm) {
    const idx = norm.indexOf(label);
    if (idx > 0 && idx < cut) cut = idx;
  }
  return cleanValue(value.slice(0, cut));
}

// Finds a value for the given (diacritics-free, lowercase, comma-free) label
// variants — checking each variant across the *whole* document before trying the
// next, so a specific label ("tên công ty viết bằng tiếng Việt") always wins over
// a shorter one that's also a substring of it ("tên công ty", which also matches
// the "1. Tên công ty" section heading above it).
// When a line is only the label itself (section heading, no value after it), the
// next couple of lines are checked too — re-applying the same label if it repeats
// there ("Địa chỉ trụ sở chính" appears both as heading and as the data line in
// some templates), otherwise taking the plain line as the value.
function findLabelValue(lines, normLines, labelVariants, { startAt = 0, endAt = lines.length, maxLen = 160 } = {}) {
  for (const label of labelVariants) {
    for (let i = startAt; i < endAt; i++) {
      const idx = normLines[i].indexOf(label);
      if (idx === -1) continue;
      const sameLine = cleanValue(lines[i].slice(idx + label.length));
      if (sameLine.length >= 2) return sameLine.slice(0, maxLen);
      for (let j = i + 1; j < Math.min(i + 3, endAt); j++) {
        const repeatIdx = normLines[j].indexOf(label);
        if (repeatIdx > -1) {
          const v = cleanValue(lines[j].slice(repeatIdx + label.length));
          if (v.length >= 2) return v.slice(0, maxLen);
          continue;
        }
        const plain = cleanValue(lines[j]);
        if (plain.length >= 2) return plain.slice(0, maxLen);
      }
    }
  }
  return "";
}

function findSectionStart(normLines, labelVariants) {
  for (let i = 0; i < normLines.length; i++) {
    if (labelVariants.some((l) => normLines[i].includes(l))) return i;
  }
  return -1;
}

function findCompanyFallback(lines, normLines) {
  const prefixes = ["cong ty", "doanh nghiep tu nhan", "ho kinh doanh"];
  for (let i = 0; i < normLines.length; i++) {
    const norm = normLines[i].trim();
    if (prefixes.some((p) => norm.startsWith(p)) && lines[i].trim().length > 6) {
      return cleanValue(lines[i]);
    }
  }
  return "";
}

function extractDigitsAndDash(str) {
  const m = (str || "").match(/[0-9][0-9\- ]{7,17}[0-9]/);
  return m ? m[0].replace(/\s+/g, "") : "";
}

// Best-effort parser tuned to Vietnam's "Giấy chứng nhận đăng ký doanh nghiệp".
// OCR text is noisy, so this only pre-fills the review form — the user still checks it.
function parseBusinessLicenseText(text) {
  const lines = (text || "").replace(/\r/g, "").split("\n");
  // Only case/diacritics are normalized here — normLines must stay the same length
  // and character-aligned with `lines`, since match indexes found in normLines are
  // used to slice the original `lines` strings below.
  const normLines = lines.map((l) => stripDiacritics(l.toLowerCase()));

  let company = findLabelValue(lines, normLines, ["ten cong ty viet bang tieng viet", "ten doanh nghiep viet bang tieng viet"]);
  if (!company) company = findCompanyFallback(lines, normLines);
  company = trimTrailingLabels(company, ["ten cong ty", "ten doanh nghiep", "ma so", "dia chi"]);

  const taxCodeRaw = findLabelValue(lines, normLines, ["ma so doanh nghiep", "ma so thue", "ma so dkkd"]);
  const taxCode = extractDigitsAndDash(taxCodeRaw);

  let address = findLabelValue(lines, normLines, ["dia chi tru so chinh", "dia chi kinh doanh"]);
  address = trimTrailingLabels(address, ["dien thoai", "so dien thoai", "email", "fax", "von dieu le"]);

  // Scope the representative's name/title search to the "Người đại diện theo pháp
  // luật" section specifically — GCNĐKDN forms also list an "owner" (chủ sở hữu)
  // with the same "Họ, chữ đệm và tên" field just above it, which is not the same
  // person on every certificate.
  const repSectionStart = findSectionStart(normLines, ["nguoi dai dien theo phap luat"]);
  const searchRange = repSectionStart > -1 ? { startAt: repSectionStart } : {};

  let repName = findLabelValue(lines, normLines, ["ho, chu dem va ten", "ho chu dem va ten", "ho va ten", "ho ten"], searchRange);
  repName = trimTrailingLabels(repName, ["gioi tinh", "quoc tich", "chuc danh", "ngay thang nam sinh", "sinh ngay", "dan toc"]);

  const repTitle = trimTrailingLabels(
    findLabelValue(lines, normLines, ["chuc danh"], searchRange),
    ["sinh ngay", "quoc tich"]
  );

  return { company, taxCode, address, repName, repTitle };
}

const KEYS = {

function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    console.error("Lỗi đọc dữ liệu", key, e);
    return fallback;
  }
}

function save(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

const Store = {
  // Clients
  getClients() { return load(KEYS.clients, []); },
  saveClients(list) { save(KEYS.clients, list); },
  addClient(data) {
    const list = this.getClients();
    const item = { id: uid(), createdAt: new Date().toISOString(), ...data };
    list.push(item);
    this.saveClients(list);
    return item;
  },
  updateClient(id, patch) {
    const list = this.getClients();
    const idx = list.findIndex((c) => c.id === id);
    if (idx === -1) return null;
    list[idx] = { ...list[idx], ...patch };
    this.saveClients(list);
    return list[idx];
  },
  deleteClient(id) {
    this.saveClients(this.getClients().filter((c) => c.id !== id));
  },
  getClient(id) { return this.getClients().find((c) => c.id === id) || null; },

  // Contracts
  getContracts() { return load(KEYS.contracts, []); },
  saveContracts(list) { save(KEYS.contracts, list); },
  addContract(data) {
    const list = this.getContracts();
    const item = { id: uid(), payments: [], createdAt: new Date().toISOString(), ...data };
    list.push(item);
    this.saveContracts(list);
    return item;
  },
  updateContract(id, patch) {
    const list = this.getContracts();
    const idx = list.findIndex((c) => c.id === id);
    if (idx === -1) return null;
    list[idx] = { ...list[idx], ...patch };
    this.saveContracts(list);
    return list[idx];
  },
  deleteContract(id) {
    this.saveContracts(this.getContracts().filter((c) => c.id !== id));
  },
  getContract(id) { return this.getContracts().find((c) => c.id === id) || null; },

  // Quotes
  getQuotes() { return load(KEYS.quotes, []); },
  saveQuotes(list) { save(KEYS.quotes, list); },
  addQuote(data) {
    const list = this.getQuotes();
    const item = { id: uid(), createdAt: new Date().toISOString(), ...data };
    list.push(item);
    this.saveQuotes(list);
    return item;
  },
  updateQuote(id, patch) {
    const list = this.getQuotes();
    const idx = list.findIndex((q) => q.id === id);
    if (idx === -1) return null;
    list[idx] = { ...list[idx], ...patch };
    this.saveQuotes(list);
    return list[idx];
  },
  deleteQuote(id) {
    this.saveQuotes(this.getQuotes().filter((q) => q.id !== id));
  },
  getQuote(id) { return this.getQuotes().find((q) => q.id === id) || null; },

  // Settings
  getSettings() { return { ...defaultSettings, ...load(KEYS.settings, {}) }; },
  saveSettings(data) { save(KEYS.settings, { ...this.getSettings(), ...data }); },

  // Auto document codes, e.g. HD-2026-001
  nextCode(prefix) {
    const seq = load(KEYS.seq, {});
    const year = new Date().getFullYear();
    const key = `${prefix}-${year}`;
    const next = (seq[key] || 0) + 1;
    seq[key] = next;
    save(KEYS.seq, seq);
    return `${prefix}-${year}-${String(next).padStart(3, "0")}`;
  },

  // Backup / restore
  exportAll() {
    return {
      clients: this.getClients(),
      contracts: this.getContracts(),
      quotes: this.getQuotes(),
      settings: this.getSettings(),
      exportedAt: new Date().toISOString(),
    };
  },
  importAll(data) {
    if (data.clients) this.saveClients(data.clients);
    if (data.contracts) this.saveContracts(data.contracts);
    if (data.quotes) this.saveQuotes(data.quotes);
    if (data.settings) this.saveSettings(data.settings);
  },
  clearAll() {
    Object.values(KEYS).forEach((k) => localStorage.removeItem(k));
  },
};

const modalRoot = document.getElementById("modal-root");
let escListener = null;

function closeModal() {
  modalRoot.innerHTML = "";
  if (escListener) { document.removeEventListener("keydown", escListener); escListener = null; }
}

function openModal({ title, bodyHtml, footerHtml = "", onMount, wide = false }) {
  modalRoot.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-dialog ${wide ? "wide" : ""}">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="icon-btn" data-close>&times;</button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
        ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ""}
      </div>
    </div>`;
  const overlay = modalRoot.querySelector(".modal-overlay");
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  modalRoot.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeModal));
  escListener = (e) => { if (e.key === "Escape") closeModal(); };
  document.addEventListener("keydown", escListener);
  if (onMount) onMount(modalRoot.querySelector(".modal-dialog"));
}

function monthLabels() { return Array.from({ length: 12 }, (_, i) => `T${i + 1}`); }

function monthlyRevenue(contracts, year) {
  const arr = new Array(12).fill(0);
  contracts.forEach((c) => (c.payments || []).forEach((p) => {
    if (p.paidDate) {
      const d = new Date(p.paidDate);
      if (d.getFullYear() === year) arr[d.getMonth()] += Number(p.amount || 0);
    }
  }));
  return arr;
}

function quoteTotal(q) {
  const sub = (q.items || []).reduce((s, i) => s + Number(i.quantity || 0) * Number(i.unitPrice || 0), 0);
  const discount = sub * (Number(q.discountPct || 0) / 100);
  const afterDiscount = sub - discount;
  const tax = afterDiscount * (Number(q.taxPct || 0) / 100);
  return { sub, discount, tax, total: afterDiscount + tax };
}

      <td>${escapeHtml(c.code)}</td>
      <td>${escapeHtml(client ? client.name : "—")}</td>
      <td>${escapeHtml(c.title || "")}</td>

function renderPaymentsTbody(contractId) {
  const c = Store.getContract(contractId);
  const tbody = document.getElementById("payments-tbody");
  if (!tbody || !c) return;
  const payments = (c.payments || []).slice().sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
  if (payments.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="empty">Chưa có đợt thanh toán nào</td></tr>`; return; }
  tbody.innerHTML = payments.map((p) => {
    const overdue = !p.paidDate && p.dueDate && daysUntil(p.dueDate) < 0;
    const status = p.paidDate ? `<span class="badge badge-green">Đã thu</span>` : overdue ? `<span class="badge badge-red">Quá hạn</span>` : `<span class="badge badge-amber">Chưa thu</span>`;
    return `<tr>
      <td>${formatDate(p.dueDate)}</td>
      <td>${formatCurrency(p.amount)}</td>
      <td>${status}</td>
      <td>${formatDate(p.paidDate)}</td>
      <td class="actions">
        ${!p.paidDate ? `<button class="icon-btn" data-mark-paid="${p.id}" title="Đánh dấu đã thu">✔</button>` : ""}
        <button class="icon-btn danger" data-del-payment="${p.id}" title="Xóa">🗑</button>
      </td>
    </tr>`;
  }).join("");

  tbody.querySelectorAll("[data-mark-paid]").forEach((b) => b.addEventListener("click", () => {
    const c2 = Store.getContract(contractId);
    const payments2 = c2.payments.map((p) => (p.id === b.dataset.markPaid ? { ...p, paidDate: todayISO() } : p));
    Store.updateContract(contractId, { payments: payments2 });
    renderPaymentsTbody(contractId);
    if (state.view === "contracts") renderContractsTable();
  }));
  tbody.querySelectorAll("[data-del-payment]").forEach((b) => b.addEventListener("click", () => {
    if (!confirm("Xóa đợt thanh toán này?")) return;
    const c2 = Store.getContract(contractId);
    Store.updateContract(contractId, { payments: c2.payments.filter((p) => p.id !== b.dataset.delPayment) });
    renderPaymentsTbody(contractId);
    if (state.view === "contracts") renderContractsTable();
  }));
}

function openLicenseImportModal() {
  openModal({
    title: "Nhập nhanh khách hàng từ Giấy phép kinh doanh",
    wide: true,
    bodyHtml: `
      <p class="hint" style="margin:0 0 12px">Tải lên ảnh chụp hoặc PDF của Giấy chứng nhận đăng ký doanh nghiệp (có thể chọn nhiều file cùng lúc) — hệ thống sẽ tự đọc và điền sẵn thông tin bằng nhận diện văn bản (OCR). Đây là nhận diện tự động, <strong>độ chính xác không tuyệt đối</strong> — vui lòng kiểm tra và sửa lại trước khi lưu. Cần có kết nối Internet để dùng tính năng này.</p>
      <input type="file" id="license-files" accept="image/*,.pdf" multiple />
      <div id="license-results" style="margin-top:16px; display:flex; flex-direction:column; gap:12px;"></div>
    `,
    footerHtml: `<button class="btn" data-close>Đóng</button><button class="btn btn-primary" id="license-save-all" style="display:none">Thêm khách hàng đã chọn</button>`,
    onMount: () => {
      const rows = [];
      const resultsEl = document.getElementById("license-results");
      const saveBtn = document.getElementById("license-save-all");

      function renderRows() {
        resultsEl.innerHTML = rows.map((r, idx) => `
          <div class="card" style="margin:0;padding:14px 16px;">
            <div class="row" style="align-items:center;">
              <label style="display:flex;align-items:center;gap:8px;font-weight:600;">
                <input type="checkbox" data-check="${idx}" ${r.checked ? "checked" : ""} ${r.status !== "done" ? "disabled" : ""} style="width:auto" />
                ${escapeHtml(r.file.name)}
              </label>
              <span class="badge ${r.status === "done" ? "badge-green" : r.status === "error" ? "badge-red" : "badge-amber"}">${r.status === "processing" ? "Đang đọc..." : r.status === "done" ? "Đã đọc xong" : r.status === "error" ? "Lỗi" : "Chờ xử lý"}</span>
            </div>
            ${r.status === "done" ? `
              <div class="form-grid" style="margin-top:12px;">
                <label>Tên công ty <input data-field="company" data-idx="${idx}" value="${escapeHtml(r.parsed.company)}" /></label>
                <label>Mã số thuế <input data-field="taxCode" data-idx="${idx}" value="${escapeHtml(r.parsed.taxCode)}" /></label>
                <label class="col-span-2">Địa chỉ <input data-field="address" data-idx="${idx}" value="${escapeHtml(r.parsed.address)}" /></label>
                <label>Người đại diện <input data-field="repName" data-idx="${idx}" value="${escapeHtml(r.parsed.repName)}" /></label>
                <label>Chức danh <input data-field="repTitle" data-idx="${idx}" value="${escapeHtml(r.parsed.repTitle)}" /></label>
              </div>
            ` : ""}
            ${r.status === "error" ? `<p class="muted small" style="margin-top:8px">${escapeHtml(r.errorMsg || "Không đọc được file này.")}</p>` : ""}
          </div>
        `).join("");

        resultsEl.querySelectorAll("[data-check]").forEach((cb) => cb.addEventListener("change", (e) => {
          rows[Number(e.target.dataset.check)].checked = e.target.checked;
          updateSaveBtn();
        }));
        resultsEl.querySelectorAll("[data-field]").forEach((inp) => inp.addEventListener("input", (e) => {
          rows[Number(e.target.dataset.idx)].parsed[e.target.dataset.field] = e.target.value;
        }));
      }

      function updateSaveBtn() {
        saveBtn.style.display = rows.some((r) => r.checked && r.status === "done") ? "" : "none";
      }

      document.getElementById("license-files").addEventListener("change", async (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;
        if (!ocrLibsAvailable()) {
          alert("Không tải được thư viện nhận diện văn bản. Vui lòng kiểm tra kết nối Internet rồi thử lại.");
          return;
        }
        const startIdx = rows.length;
        files.forEach((file) => rows.push({
          file, status: "queued", checked: true,
          parsed: { company: "", taxCode: "", address: "", repName: "", repTitle: "" },
        }));
        renderRows();

        for (let i = startIdx; i < rows.length; i++) {
          const row = rows[i];
          row.status = "processing";
          renderRows();
          try {
            const text = await ocrFile(row.file);
            row.parsed = parseBusinessLicenseText(text);
            row.status = "done";
          } catch (err) {
            row.status = "error";
            row.errorMsg = String(err?.message || err);
          }
          renderRows();
          updateSaveBtn();
        }
      });

      saveBtn.addEventListener("click", () => {
        let count = 0;
        rows.filter((r) => r.checked && r.status === "done").forEach((r) => {
          const p = r.parsed;
          if (!p.company && !p.repName && !p.taxCode) return;
          Store.addClient({
            name: p.repName || p.company || "Khách hàng mới",
            company: p.company,
            taxCode: p.taxCode,
            address: p.address,
            repName: p.repName,
            repTitle: p.repTitle,
          });
          count++;
        });
        closeModal();
        renderCurrentView();
        alert(`Đã thêm ${count} khách hàng từ giấy phép kinh doanh.`);
      });
    },
  });
}

function renderQuotesTable() {
  const tbody = document.getElementById("quotes-tbody");
  if (!tbody) return;
  let quotes = Store.getQuotes();
  const q = state.quoteSearch.trim().toLowerCase();
  quotes = quotes.filter((qt) => {
    const client = Store.getClient(qt.clientId);
    const hay = `${qt.code} ${client ? client.name : ""}`.toLowerCase();
    const matchQ = !q || hay.includes(q);
    const matchStatus = state.quoteStatus === "all" || qt.status === state.quoteStatus;
    return matchQ && matchStatus;
  });
  quotes.sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));

  if (quotes.length === 0) { tbody.innerHTML = `<tr><td colspan="7" class="empty">Chưa có báo giá nào</td></tr>`; return; }

  tbody.innerHTML = quotes.map((qt) => {
    const client = Store.getClient(qt.clientId);
    const { total } = quoteTotal(qt);
    const meta = STATUS_QUOTE[qt.status] || { label: qt.status, color: "#64748b" };
    return `<tr>
      <td>${escapeHtml(qt.code)}</td>
      <td>${escapeHtml(client ? client.name : "—")}</td>
      <td>${formatDate(qt.date)}</td>
      <td>${formatDate(qt.validUntil)}</td>
      <td>${formatCurrency(total)}</td>
      <td><span class="badge" style="background:${meta.color}22;color:${meta.color}">${meta.label}</span></td>
      <td class="actions">
        <button class="icon-btn" data-print-id="${qt.id}" title="In / Xem">🖨</button>
        <button class="icon-btn" data-edit-id="${qt.id}" title="Sửa">✎</button>
        ${qt.status !== "converted" ? `<button class="icon-btn" data-convert-id="${qt.id}" title="Chuyển thành hợp đồng">➜</button>` : ""}
        <button class="icon-btn danger" data-del-id="${qt.id}" title="Xóa">🗑</button>
      </td>
    </tr>`;
  }).join("");

  tbody.querySelectorAll("[data-print-id]").forEach((b) => b.addEventListener("click", () => pickLanguageThen((lang) => printQuote(b.dataset.printId, lang))));
  tbody.querySelectorAll("[data-edit-id]").forEach((b) => b.addEventListener("click", () => openQuoteForm(b.dataset.editId)));
  tbody.querySelectorAll("[data-convert-id]").forEach((b) => b.addEventListener("click", () => convertQuoteToContract(b.dataset.convertId)));
  tbody.querySelectorAll("[data-del-id]").forEach((b) => b.addEventListener("click", () => {
    if (confirm("Xóa báo giá này?")) { Store.deleteQuote(b.dataset.delId); renderQuotesTable(); }
  }));
}

    paymentTerms: DEFAULT_QUOTE_PAYMENT_TERMS,
    note: DEFAULT_QUOTE_NOTE,

  openModal({
    title: editing ? "Sửa báo giá" : "Tạo báo giá",
    wide: true,
    bodyHtml: `
      <form id="quote-form" class="form-grid">
        <label>Khách hàng
          <select name="clientId" required>${clientOptions(data.clientId)}</select>
        </label>
        <label>Trạng thái
          <select name="status">${Object.entries(STATUS_QUOTE).filter(([k]) => k !== "converted").map(([k, m]) => `<option value="${k}" ${data.status ? (data.status === k ? "selected" : "") : (k === "draft" ? "selected" : "")}>${m.label}</option>`).join("")}</select>
        </label>
        <label>Ngày báo giá
          <input type="date" name="date" value="${data.date || todayISO()}" />
        </label>
        <label>Hiệu lực đến
          <input type="date" name="validUntil" value="${data.validUntil || ""}" />
        </label>
        <label>Phạm vi (tùy chọn)
          <input name="scope" value="${escapeHtml(data.scope || "")}" placeholder="VD: Tư vấn trọn gói" />
        </label>
        <label>Thời gian thực hiện dự kiến (tùy chọn)
          <input name="duration" value="${escapeHtml(data.duration || "")}" placeholder="VD: 1 tháng" />
        </label>
        <div class="col-span-2">
          <div class="row" style="align-items:center;"><h4 style="margin:8px 0">Hạng mục dịch vụ</h4><button type="button" class="btn btn-sm" id="btn-add-item">+ Thêm dòng</button></div>
          <div class="table-wrap"><table class="data-table">
            <thead><tr><th>Mô tả</th><th>ĐVT</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th><th></th></tr></thead>
            <tbody id="items-tbody"></tbody>
          </table></div>
        </div>
        <label>Chiết khấu (%)
          <input type="number" name="discountPct" min="0" max="100" value="${data.discountPct || 0}" />
        </label>
        <label>Thuế VAT (%)
          <input type="number" name="taxPct" min="0" max="100" value="${data.taxPct ?? 10}" />
        </label>
        <div class="col-span-2" id="quote-total-line"></div>
        <label class="col-span-2">Điều khoản thanh toán (tùy chọn)
          <textarea name="paymentTerms" rows="4" placeholder="VD: Thanh toán 50% khi ký hợp đồng, 50% còn lại khi nghiệm thu.">${escapeHtml(data.paymentTerms || "")}</textarea>
        </label>
        <label class="col-span-2">Ghi chú
          <textarea name="note" rows="4">${escapeHtml(data.note || "")}</textarea>
        </label>
      </form>
      ${Store.getClients().length === 0 ? '<p class="hint">Bạn chưa có khách hàng nào. Hãy vào mục Khách hàng để thêm trước.</p>' : ""}
    `,
    footerHtml: `<button class="btn" data-close>Hủy</button><button class="btn btn-primary" id="quote-save">${editing ? "Lưu thay đổi" : "Tạo báo giá"}</button>`,
    onMount: () => {
      let items = (data.items || []).map((i) => ({ ...i }));
      const tbody = document.getElementById("items-tbody");
      const form = document.getElementById("quote-form");

      function renderItems() {
        tbody.innerHTML = items.map((it, idx) => `
          <tr>
            <td><input data-idx="${idx}" data-field="description" value="${escapeHtml(it.description || "")}" placeholder="Mô tả dịch vụ" /></td>
            <td><input data-idx="${idx}" data-field="unit" value="${escapeHtml(it.unit || "")}" style="width:70px" /></td>
            <td><input type="number" min="0" data-idx="${idx}" data-field="quantity" value="${it.quantity ?? 1}" style="width:64px" /></td>
            <td><input type="number" min="0" step="1000" data-idx="${idx}" data-field="unitPrice" value="${it.unitPrice ?? 0}" style="width:120px" /></td>
            <td class="line-total">${formatCurrency(Number(it.quantity || 0) * Number(it.unitPrice || 0))}</td>
            <td><button type="button" class="icon-btn danger" data-remove="${idx}">🗑</button></td>
          </tr>`).join("");
        tbody.querySelectorAll("input").forEach((inp) => inp.addEventListener("input", (e) => {
          const idx = Number(e.target.dataset.idx);
          const field = e.target.dataset.field;
          items[idx][field] = (field === "quantity" || field === "unitPrice") ? Number(e.target.value) : e.target.value;
          const row = e.target.closest("tr");
          row.querySelector(".line-total").textContent = formatCurrency(Number(items[idx].quantity || 0) * Number(items[idx].unitPrice || 0));
          updateTotals();
        }));
        tbody.querySelectorAll("[data-remove]").forEach((b) => b.addEventListener("click", () => {
          items.splice(Number(b.dataset.remove), 1);
          if (items.length === 0) items.push({ description: "", unit: "gói", quantity: 1, unitPrice: 0 });
          renderItems();
          updateTotals();
        }));
      }

      function updateTotals() {
        const discountPct = Number(form.discountPct.value || 0);
        const taxPct = Number(form.taxPct.value || 0);
        const sub = items.reduce((s, i) => s + Number(i.quantity || 0) * Number(i.unitPrice || 0), 0);
        const discount = (sub * discountPct) / 100;
        const afterDiscount = sub - discount;
        const tax = (afterDiscount * taxPct) / 100;
        const total = afterDiscount + tax;
        document.getElementById("quote-total-line").innerHTML = `
          <div class="totals-box">
            <div><span>Tạm tính</span><span>${formatCurrency(sub)}</span></div>
            <div><span>Chiết khấu</span><span>-${formatCurrency(discount)}</span></div>
            <div><span>VAT</span><span>${formatCurrency(tax)}</span></div>
            <div class="grand"><span>Tổng cộng</span><span>${formatCurrency(total)}</span></div>
          </div>`;
      }

      renderItems();
      updateTotals();
      document.getElementById("btn-add-item").addEventListener("click", () => {
        items.push({ description: "", unit: "gói", quantity: 1, unitPrice: 0 });
        renderItems();
        updateTotals();
      });
      form.discountPct.addEventListener("input", updateTotals);
      form.taxPct.addEventListener("input", updateTotals);

      document.getElementById("quote-save").addEventListener("click", () => {
        if (!form.reportValidity()) return;
        const payload = Object.fromEntries(new FormData(form).entries());
        payload.discountPct = Number(payload.discountPct || 0);
        payload.taxPct = Number(payload.taxPct || 0);
        payload.items = items.filter((i) => i.description);
        if (editing) Store.updateQuote(editing.id, payload);
        else { payload.code = Store.nextCode("BG"); Store.addQuote(payload); }
        closeModal();
        renderCurrentView();
      });
    },
  });
}

function convertQuoteToContract(id) {
  const q = Store.getQuote(id);
  if (!q) return;
  const { total } = quoteTotal(q);
  closeModal();
  openContractForm(null, {
    clientId: q.clientId,
    title: `Hợp đồng theo báo giá ${q.code}`,
    description: (q.items || []).map((i) => `- ${i.description} (SL ${i.quantity} x ${formatCurrency(i.unitPrice)})`).join("\n"),
    value: Math.round(total),
  }, () => {
    Store.updateQuote(id, { status: "converted" });
    if (state.view === "quotes") renderQuotesTable();
  });
}

function renderReports() {
  const el = document.getElementById("view-reports");
  const contracts = Store.getContracts();
  const years = Array.from(new Set(contracts.map((c) => new Date(c.startDate || c.createdAt).getFullYear()).filter((y) => !isNaN(y))));
  if (!years.includes(state.reportYear)) years.push(state.reportYear);
  years.sort((a, b) => b - a);

  const totalValue = contracts.filter((c) => c.status !== "cancelled").reduce((s, c) => s + Number(c.value || 0), 0);
  const totalPaid = contracts.reduce((s, c) => s + (c.payments || []).filter((p) => p.paidDate).reduce((s2, p) => s2 + Number(p.amount || 0), 0), 0);
  const avgValue = contracts.length ? totalValue / contracts.length : 0;

  const clients = Store.getClients();
  const topClients = clients.map((cl) => {
    const cs = contracts.filter((c) => c.clientId === cl.id);
    return { client: cl, count: cs.length, total: cs.reduce((s, c) => s + Number(c.value || 0), 0) };
  }).filter((x) => x.count > 0).sort((a, b) => b.total - a.total).slice(0, 8);

  el.innerHTML = `
    <div class="page-header row">
      <div><h2>Báo cáo</h2><p class="muted">Thống kê doanh thu và hợp đồng</p></div>
      <select id="report-year">${years.map((y) => `<option value="${y}" ${y === state.reportYear ? "selected" : ""}>${y}</option>`).join("")}</select>
    </div>
    <div class="stat-grid">
      ${statCard("Tổng giá trị hợp đồng", formatCurrency(totalValue), "blue", "💰")}
      ${statCard("Tổng đã thu", formatCurrency(totalPaid), "green", "✅")}
      ${statCard("Giá trị TB / hợp đồng", formatCurrency(avgValue), "indigo", "📊")}
      ${statCard("Tổng số hợp đồng", contracts.length, "teal", "📄")}
    </div>
    <div class="card">
      <h3>Doanh thu theo tháng (${state.reportYear})</h3>
      <canvas id="chart-report-revenue" height="240"></canvas>
    </div>
    <div class="grid-2">
      <div class="card">
        <h3>Phân bổ trạng thái hợp đồng</h3>
        <canvas id="chart-report-status" height="220"></canvas>
      </div>
      <div class="card">
        <h3>Khách hàng theo giá trị</h3>
        <table class="data-table">
          <thead><tr><th>Khách hàng</th><th>Số HĐ</th><th>Tổng giá trị</th></tr></thead>
          <tbody>${topClients.length ? topClients.map((x) => `<tr><td>${escapeHtml(x.client.name)}</td><td>${x.count}</td><td>${formatCurrency(x.total)}</td></tr>`).join("") : `<tr><td colspan="3" class="empty">Chưa có dữ liệu</td></tr>`}</tbody>
        </table>
      </div>
    </div>
  `;
  document.getElementById("report-year").addEventListener("change", (e) => { state.reportYear = Number(e.target.value); renderReports(); });
  drawBarChart(document.getElementById("chart-report-revenue"), monthLabels(), monthlyRevenue(contracts, state.reportYear), { formatValue: (v) => (v / 1e6).toFixed(0) + "tr" });
  drawDonutChart(document.getElementById("chart-report-status"), Object.entries(STATUS_CONTRACT).map(([key, meta]) => ({ label: meta.label, value: contracts.filter((c) => c.status === key).length, color: meta.color })));
}

/* ================= SETTINGS ================= */
function renderSettings() {
  const el = document.getElementById("view-settings");
  const s = Store.getSettings();
  el.innerHTML = `
    <div class="page-header"><h2>Cài đặt</h2><p class="muted">Thông tin công ty và tùy chọn hệ thống</p></div>
    <div class="card">
      <h3>Thông tin công ty (hiển thị trên báo giá)</h3>
      <form id="settings-form" class="form-grid">
        <label>Tên công ty <input name="companyName" value="${escapeHtml(s.companyName)}" /></label>
        <label>Mã số thuế <input name="companyTaxCode" value="${escapeHtml(s.companyTaxCode)}" /></label>
        <label class="col-span-2">Địa chỉ <input name="companyAddress" value="${escapeHtml(s.companyAddress)}" /></label>
        <label>Điện thoại <input name="companyPhone" value="${escapeHtml(s.companyPhone)}" /></label>
        <label>Email <input type="email" name="companyEmail" value="${escapeHtml(s.companyEmail)}" /></label>
        <label>Người đại diện <input name="repName" value="${escapeHtml(s.repName || "")}" /></label>
        <label>Chức danh người đại diện <input name="repTitle" value="${escapeHtml(s.repTitle || "")}" /></label>
        <label>Số ngày cảnh báo sắp hết hạn <input type="number" min="1" name="reminderDays" value="${s.reminderDays}" /></label>
      </form>
      <button class="btn btn-primary" id="settings-save" style="margin-top:12px">Lưu cài đặt</button>
    </div>
    <div class="card">
      <h3>Thông tin ngân hàng (hiển thị trên hợp đồng)</h3>
      <form id="bank-form" class="form-grid">
        <label class="col-span-2">Chủ tài khoản <input name="bankAccountName" value="${escapeHtml(s.bankAccountName || "")}" /></label>
        <label>Số tài khoản <input name="bankAccountNumber" value="${escapeHtml(s.bankAccountNumber || "")}" /></label>
        <label>Ngân hàng <input name="bankName" value="${escapeHtml(s.bankName || "")}" /></label>
      </form>
      <button class="btn btn-primary" id="bank-save" style="margin-top:12px">Lưu thông tin ngân hàng</button>
    </div>
    <div class="card">
      <h3>Dữ liệu</h3>
      <p class="muted">Dữ liệu được lưu ngay trên trình duyệt này (localStorage). Hãy sao lưu định kỳ để tránh mất dữ liệu.</p>
      <div class="row" style="gap:8px">
        <button class="btn" id="btn-export">⬇ Xuất dữ liệu (JSON)</button>
        <label class="btn" style="cursor:pointer">⬆ Nhập dữ liệu
          <input type="file" id="btn-import" accept="application/json" style="display:none" />
        </label>
        <button class="btn danger" id="btn-clear">🗑 Xóa toàn bộ dữ liệu</button>
      </div>
    </div>
  `;

  document.getElementById("settings-save").addEventListener("click", () => {
    const form = document.getElementById("settings-form");
    const payload = Object.fromEntries(new FormData(form).entries());
    payload.reminderDays = Number(payload.reminderDays) || 30;
    Store.saveSettings(payload);
    alert("Đã lưu cài đặt.");
  });

  document.getElementById("bank-save").addEventListener("click", () => {
    const form = document.getElementById("bank-form");
    const payload = Object.fromEntries(new FormData(form).entries());
    Store.saveSettings(payload);
    alert("Đã lưu thông tin ngân hàng.");
  });

  document.getElementById("btn-export").addEventListener("click", () => {
    const data = Store.exportAll();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `hop-dong-tu-van-backup-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  document.getElementById("btn-import").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (confirm("Nhập dữ liệu sẽ ghi đè dữ liệu hiện tại. Tiếp tục?")) {
          Store.importAll(data);
          alert("Nhập dữ liệu thành công.");
          renderCurrentView();
        }
      } catch (err) {
        alert("File không hợp lệ.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById("btn-clear").addEventListener("click", () => {
    if (confirm("Xóa toàn bộ dữ liệu? Hành động này không thể hoàn tác.")) {
      Store.clearAll();
      renderCurrentView();
    }
  });
}

/* ---------------- Init ---------------- */
renderCurrentView();
  </script>
</body>
</html>
